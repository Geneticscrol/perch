; PlatformIO project for PERCH on ShrikeFi.
; Build + flash:   pio run -e shrikefi -t upload && pio device monitor
;
; Which USB-C port?  ShrikeFi has two:
;   * CH9102 USB-UART port  -> env "shrikefi"            (recommended)
;   * native ESP32-S3 USB   -> env "shrikefi_native_usb"

[platformio]
src_dir = Perch
default_envs = shrikefi

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
; 4 MB boots on both the 4 MB and 8 MB flash stories in Vicharak's docs.
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

[env:shrikefi]
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:shrikefi_native_usb]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
